name: secrets-check

# Proves the friend-style sops chain works end to end:
# repo holds only ciphertext (secrets/secret.yaml), the single
# SOPS_AGE_KEY repo secret opens it, tokens live only in job memory.
on:
  push:
    branches: [main]
    paths:
      - "secrets/**"
      - ".github/workflows/secrets-check.yml"
      - "flake.lock"
  pull_request:
    paths:
      - "secrets/**"
      - ".github/workflows/secrets-check.yml"
  workflow_dispatch:

jobs:
  unlock-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install sops + age
        run: |
          set -euo pipefail
          SOPS_VERSION="3.13.3"
          AGE_VERSION="1.3.1"
          curl -fsSL -o /tmp/sops "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          curl -fsSL -o /tmp/age.tar.gz "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/age.tar.gz -C /tmp
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sudo install -m 0755 /tmp/age/age /usr/local/bin/age
          sops --version
          age --version

      - name: Unlock secret.yaml with SOPS_AGE_KEY
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SOPS_AGE_KEY:-}" || { echo "::error::SOPS_AGE_KEY repo secret is missing"; exit 1; }
          printf '%s' "$SOPS_AGE_KEY" > /tmp/age-key.txt
          chmod 600 /tmp/age-key.txt
          export SOPS_AGE_KEY_FILE=/tmp/age-key.txt
          sops -d secrets/secret.yaml > /tmp/unlocked.yaml
          test -s /tmp/unlocked.yaml || { echo "::error::decrypt produced empty output"; exit 1; }
          echo "decrypt: OK ($(wc -l < /tmp/unlocked.yaml) lines, content never printed)"

      - name: Verify github_token works (masked, never printed)
        env:
          SOPS_AGE_KEY_FILE: /tmp/age-key.txt
        run: |
          set -euo pipefail
          TOKEN="$(sops -d --extract '["github_token"]' secrets/secret.yaml)"
          echo "::add-mask::$TOKEN"
          LOGIN="$(GH_TOKEN="$TOKEN" gh api user --jq .login)"
          echo "token belongs to: $LOGIN"
          unset TOKEN

      - name: Scrub key material
        if: always()
        run: rm -f /tmp/age-key.txt /tmp/unlocked.yaml /tmp/sops /tmp/age.tar.gz
