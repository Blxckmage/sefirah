name: "🔮 Auto-generate structure diagram"

on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'lib/**'
      - 'overlays/**'
      - 'pkgs/**'
      - 'flake.nix'
      - 'hardware-configuration.nix'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-diagram:
    name: "Generate Mermaid structure diagram"
    runs-on: ubuntu-latest
    steps:
      - name: "⬇️ Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔧 Setup Nix"
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: "📜 Run diagram generator"
        run: |
          chmod +x ./scripts/generate-structure-diagram.sh
          ./scripts/generate-structure-diagram.sh

      - name: "📝 Commit diagram if changed"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet structure-diagram.mmd; then
            git add structure-diagram.mmd
            git commit -m "🔮 chore: auto-update structure diagram [skip ci]"
            git push
          else
            echo "No changes to diagram"
          fi