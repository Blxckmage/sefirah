<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="strong">
    <family>Px437 Tandy2K</family>
    <prefer>
      <family>Px437 Tandy2K</family>
      <family>PxPlus IBM VGA 8x16</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Px437 AT&amp;T PC6300</family>
    <prefer>
      <family>Px437 AT&amp;T PC6300</family>
      <family>PxPlus IBM VGA 8x16</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Px437 CompaqThin 8x16</family>
    <prefer>
      <family>Px437 CompaqThin 8x16</family>
      <family>PxPlus IBM VGA 8x16</family>
    </prefer>
  </alias>
  <match target="font">
    <test name="family" compare="contains"><string>Px437 </string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>PxPlus </string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
